<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D5A34" />
      <stop offset="100%" stop-color="#0E301B" />
    </linearGradient>
    <linearGradient id="cardBack" x1="112" y1="88" x2="340" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5633A" />
      <stop offset="100%" stop-color="#C6431E" />
    </linearGradient>
    <linearGradient id="cardFront" x1="176" y1="74" x2="404" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#F2E9D8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="18" y="18" width="476" height="476" rx="96" stroke="#F0B429" stroke-opacity="0.35" stroke-width="6" />
  <!-- Tilted back card in signature terracotta orange -->
  <g transform="rotate(-11 215 268)">
    <rect x="108" y="102" width="214" height="312" rx="28" fill="url(#cardBack)" stroke="#FAF5ED" stroke-width="8" />
    <rect x="128" y="122" width="174" height="272" rx="16" stroke="#FDE2C8" stroke-opacity="0.45" stroke-width="4" stroke-dasharray="10 8" />
  </g>
  <!-- Front ivory Ace of Spades card -->
  <g transform="rotate(6 292 256)">
    <rect x="178" y="90" width="222" height="324" rx="28" fill="url(#cardFront)" stroke="#D9CBB5" stroke-width="5" />
    <!-- Top-left A -->
    <text x="206" y="152" font-family="Georgia, serif" font-weight="700" font-size="56" fill="#171C22">A</text>
    <!-- Center Spade -->
    <path d="M289 178 C289 178 228 242 228 282 C228 310 250 326 271 326 C281 326 286 322 289 318 C292 322 297 326 307 326 C328 326 350 310 350 282 C350 242 289 178 289 178 Z" fill="#171C22" />
    <path d="M289 306 L266 356 L312 356 Z" fill="#171C22" />
    <!-- Gold crown badge -->
    <circle cx="358" cy="134" r="22" fill="#F0B429" />
    <path d="M348 140 L351 128 L358 134 L365 128 L368 140 Z" fill="#1D1508" />
  </g>
</svg>
